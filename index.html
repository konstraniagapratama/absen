<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<script>window.KONSTRA_API = "https://script.google.com/macros/s/AKfycbyNIhwNeRhhxcP1HM9zmq5PMVozGyfHaqnG0qFns5O4raMed5KSdVSK1uz1bujj7gf9rA/exec";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Konstra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: corporate stationery. Porcelain page, evergreen clock panel with a fine diamond lattice (from the logo), maroon only as a signature rule/indicator. Kiosk = panel + name grid; admin = tabs + ledger tables. */
:root{
  --bg:#E6EEE8; --surface:#FFFFFF; --sunk:#E9EFEA; --line:#D6E0D8; --line-strong:#C2CEC5; --lattice:rgba(15,58,41,.05);
  --fg:#16211B; --muted:#5E6C63;
  --accent:#145C3A; --accent-fg:#FFFFFF; --accent-soft:#E6F0EA;
  --panel:#0F3A29; --panel-fg:#F3F6F1;
  --maroon:#7C1E35; --maroon-soft:#F6E7EB;
  --sun:#7C1E35; --sun-fg:#FFFFFF;
  --ok:#17784A; --ok-soft:#E1F2E8; --warn:#B4560B; --warn-soft:#FBEBDB; --bad:#B42335; --bad-soft:#FAE3E6;
  --paper:#FFFFFF; --shadow:0 1px 2px rgba(15,34,25,.05),0 12px 32px rgba(15,34,25,.07);
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09100C; --surface:#111B15; --sunk:#17241D; --line:#24352B; --line-strong:#33483B; --lattice:rgba(255,255,255,.03);
  --fg:#E9F0EA; --muted:#97A99D; --accent:#6CC79A; --accent-fg:#06200F; --accent-soft:#13301F;
  --panel:#0E2A1F; --panel-fg:#EEF4EF; --maroon:#E07A93; --maroon-soft:#35161F; --sun:#E07A93; --sun-fg:#2A0610;
  --ok:#5BD49A; --ok-soft:#123327; --warn:#F0A659; --warn-soft:#3A2810; --bad:#FF7C8C; --bad-soft:#3D1820;
  --paper:#16231B; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B120E; --surface:#111B15; --sunk:#17241D; --line:#24352B; --line-strong:#33483B;
  --fg:#E9F0EA; --muted:#97A99D; --accent:#6CC79A; --accent-fg:#06200F; --accent-soft:#13301F;
  --panel:#0E2A1F; --panel-fg:#EEF4EF; --maroon:#E07A93; --maroon-soft:#35161F; --sun:#E07A93; --sun-fg:#2A0610;
  --ok:#5BD49A; --ok-soft:#123327; --warn:#F0A659; --warn-soft:#3A2810; --bad:#FF7C8C; --bad-soft:#3D1820;
  --paper:#16231B; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:repeating-linear-gradient(45deg,var(--lattice) 0 1px,transparent 1px 28px),repeating-linear-gradient(-45deg,var(--lattice) 0 1px,transparent 1px 28px);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.005em}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;margin-top:10px;background:var(--panel);color:var(--panel-fg);border-radius:14px;display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(9,30,20,.18)}
.top::after{content:"";position:absolute;left:16px;bottom:0;width:64px;height:3px;background:var(--maroon);border-radius:2px 2px 0 0}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.logo{height:50px;width:auto;border-radius:9px;background:#FFFFFF;padding:4px 8px;display:block}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block;line-height:1.15;color:var(--panel-fg)}
.brand small{display:block;color:var(--panel-fg);opacity:.68;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.brandbar{height:22px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px;color:var(--panel-fg);opacity:.75}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F3A29;opacity:1}
.sync{font-size:12px;color:var(--panel-fg);opacity:.8;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}

/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#FFFFFF;border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* notice */
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:16px}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.alertbox{background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.alertbox>b{color:var(--warn);font-size:14px}
.alertbox>p{margin:2px 0 6px;font-size:12.5px;color:var(--warn)}
.alrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.alrow>div{min-width:0}
.alrow>div span{display:block;font-size:12.5px;color:var(--muted)}

/* ===== KIOSK ===== */
.kiosk{display:grid;grid-template-columns:350px 1fr;gap:28px;align-items:start}
.clockcard{background-color:var(--panel);color:var(--panel-fg);border-radius:14px;padding:28px 26px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);overflow:hidden;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px)}
.clockcard::before{content:"";position:absolute;right:-46px;top:-46px;width:132px;height:132px;transform:rotate(45deg);border:1px solid rgba(255,255,255,.18);border-radius:6px}
.clockcard::after{content:"";position:absolute;left:26px;right:26px;bottom:0;height:3px;background:var(--maroon)}
.clockcard>*{position:relative}
.clockcard .eyebrow{color:inherit;opacity:.7}
.bigclock{font-family:var(--f-body);font-weight:200;font-size:76px;line-height:1;letter-spacing:-.02em;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.bigclock span{font-size:30px;opacity:.55;font-weight:300}
.today{font-family:var(--f-display);font-size:19px;opacity:.95}
.storebtn{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:transparent;border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:10px;padding:12px 14px;text-align:left;transition:background .15s}
.storebtn:hover{background:rgba(255,255,255,.07)}
.storebtn b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block}
.shiftnow{margin-top:16px;font-size:13px;opacity:.85}
.counts{display:flex;gap:28px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16)}
.counts div{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.counts b{display:block;font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:0;text-transform:none;opacity:1;line-height:1.1}

.picker h2{font-size:32px}
.pickhead{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:200px;max-width:340px;position:relative}
.search input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:11px 14px 11px 40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.emp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;display:flex;flex-direction:column;gap:16px;min-height:140px;transition:border-color .15s,box-shadow .15s,transform .15s}
.emp:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.emp .who{display:flex;gap:14px;align-items:center}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:17px;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.emp .nm{font-weight:700;line-height:1.3}
.emp .rl{font-size:12px;color:var(--muted);margin-top:2px}
.emp .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.sample{background:var(--maroon-soft);color:var(--maroon)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg);display:block;font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:4px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,14,.55);z-index:20;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:440px;max-height:calc(100% - 16px);overflow:auto;padding:26px;box-shadow:var(--shadow);border-top:3px solid var(--maroon)}
.sheet.wide{max-width:640px}
.sheethead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sheethead .x{margin-left:auto}
.pinrow{display:flex;justify-content:center;gap:16px;margin:8px 0 22px}
.pinrow i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
.pinrow i.f{background:var(--accent);border-color:var(--accent)}
.pinrow.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:60px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-body);font-size:24px;font-weight:300;font-variant-numeric:tabular-nums}
.pad button:hover{border-color:var(--accent)}
.pad button:active{background:var(--accent-soft)}
.pad .fn{font-size:13px;font-weight:600;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600;text-align:center;min-height:20px;margin-top:10px}
.cam{aspect-ratio:1;max-width:100%;width:240px;margin:0 auto 18px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border:1px dashed var(--line-strong)}
.cam img{width:100%;height:100%;object-fit:cover}
.actrow{display:flex;gap:10px;flex-wrap:wrap}
.actrow .btn{flex:1}
.bigact{width:100%;padding:17px;font-size:17px;border-radius:10px}

/* receipt */
.receipt{background:var(--paper);color:var(--fg);font-family:var(--f-body);font-size:13px;padding:24px 22px;position:relative;margin:0 auto 8px;max-width:330px;border:1px solid var(--line);border-top:3px solid var(--maroon);border-radius:4px}
.receipt .c{text-align:center}
.receipt h3{font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.06em}
.receipt hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .r span:first-child{color:var(--muted)}
.receipt .t{font-family:var(--f-body);font-size:48px;font-weight:200;text-align:center;letter-spacing:-.02em;margin:6px 0;font-variant-numeric:tabular-nums}
.receipt .st{text-align:center;margin-top:8px}
.countdown{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}

/* ===== ADMIN ===== */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--maroon)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{padding:18px 20px;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line)}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:38px;display:block;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{display:block;margin-top:2px}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:18px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardhead h3{font-size:21px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:12px 20px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:12px 20px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px}
.thumbs button{width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;overflow:hidden;background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .none{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:11px}
.namecell{display:flex;align-items:center;gap:12px}
.namecell .av{width:34px;height:34px;font-size:13px}
.sub{font-size:12px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.formgrid .full{grid-column:1/-1}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.listrow{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.listrow input{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0}
.pad16{padding:18px 20px}
.gate{max-width:380px;margin:48px auto;text-align:center}
.gate h2{font-size:30px;margin-bottom:6px}
.gate p{color:var(--muted);margin:0 0 20px}
.pinlist{display:flex;flex-direction:column}.pinrow2{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line)}.pinact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-left:auto}
.confirmbar{display:flex;gap:8px;align-items:center;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--panel-fg);padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow)}
.bigphoto{width:100%;border-radius:12px}

/* weekly report */
.wknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wknav select{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wknav .range{font-family:var(--f-display);font-weight:400;font-size:24px;padding:0 8px}
.kpis.five{grid-template-columns:repeat(5,1fr)}
.kpi .meter{height:4px;border-radius:99px;background:var(--sunk);margin-top:12px;overflow:hidden}
.kpi .meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;padding:22px 20px 12px;align-items:end}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.chart .track{width:100%;max-width:44px;height:150px;background:var(--sunk);border-radius:6px;display:flex;flex-direction:column-reverse;overflow:hidden}
.chart .s-ok{background:var(--accent)} .chart .s-late{background:var(--warn)}
.chart .val{font-family:var(--f-display);font-size:17px}
.chart .lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.35}
.chart .col.off .track{opacity:.45} .chart .col.today .lbl{color:var(--maroon)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 20px 16px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i,.dots i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--sunk)}
.legend i.ok{background:var(--accent)}
.dots{display:flex;gap:4px}
.dots i.ok{background:var(--accent)} .dots i.late,.legend i.late{background:var(--warn)} .dots i.absent,.legend i.absent{background:var(--bad)}
.dots i.pending,.legend i.pending{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)} .dots i.off,.legend i.off{opacity:.5}
.attn{display:grid;gap:0}
.attn .row{display:flex;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.attn .row:first-child{border-top:0}
.daycheck{display:flex;gap:6px;flex-wrap:wrap}
.daycheck label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--fg)}

@media (max-width:860px){
  .kiosk{grid-template-columns:1fr;gap:22px}
  .clockcard{position:relative;top:auto}
  .bigclock{font-size:60px}
  .kpis,.kpis.five{grid-template-columns:repeat(2,1fr)}
  .kpis.five .kpi:last-child{grid-column:1/-1}
  .chart{gap:6px;padding-inline:12px} .chart .track{height:110px}
  .setgrid,.formgrid{grid-template-columns:1fr}
  .brand b{font-size:18px}
  .logo{height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.busy{position:fixed;inset:0;background:rgba(8,20,14,.35);z-index:30;display:grid;place-items:center}
.busy div{background:var(--surface);padding:14px 20px;border-radius:10px;font-weight:600;box-shadow:var(--shadow)}
a.btn{text-decoration:none;color:inherit}
html,body{margin:0}
[hidden]{display:none!important}
.megrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.megrid .btn{padding:12px 10px;font-size:14px}
.mestat{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.field textarea{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;resize:vertical;min-height:84px}
.choice{display:grid;gap:8px;margin:10px 0 14px}
.choice .btn{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px}
.choice .btn span{font-size:12px;font-weight:500;opacity:.8}
.minikpi{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.minikpi div{padding:10px 8px;text-align:center;box-shadow:-1px 0 0 var(--line)}
.minikpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.minikpi span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.histlist{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:46vh;overflow-y:auto}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .sub{white-space:normal}
.notice.info{margin-bottom:12px}

const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"], BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const jkFmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function jk(ms){ const p={}; jkFmt.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value); return {y:+p.year,mo:+p.month,d:+p.day,h:+p.hour,mi:+p.minute,s:+p.second,key:`${p.year}-${p.month}-${p.day}`}; }
const longDate = key => { const [y,m,d]=key.split("-").map(Number); return `${HARI[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}, ${d} ${BULAN[m-1]} ${y}`; };
const dur = min => `${Math.floor((min||0)/60)}j ${Math.round((min||0)%60)}m`;
const mnt = v => { const t=Math.round(Number(v)||0), h=Math.floor(t/60), m=t%60; return h ? h+" jam"+(m?" "+m+" mnt":"") : m+" mnt"; };

const S = { data:null, offset:0, mode:"kiosk", store: URL_TOKO || ls.get("konstra_unit") || "", search:"",
  adminPin:null, sheetUrl:"", tab:"hari", day:null, dayStore:"all", dayData:null, recFrom:null, recTo:null, recStore:"all", recData:null,
  wkStart:null, wkUnit:"all", wkData:null };
const nowMs = () => Date.now() + S.offset;
const storeName = id => ((S.data?.stores||[]).find(s=>s.id===id)||{}).name || id || "–";
const shiftOf = id => (S.data?.shifts||[]).find(s=>s.id===id) || (S.data?.shifts||[])[0] || {name:"-",start:"",end:""};

/* ---------- data ---------- */
async function refresh(silent){
  try{
    const d = await call("getKioskData");
    S.data=d; S.offset=d.now-Date.now();
    $("#syncdot").className="dot on"; $("#synctxt").textContent="Tersambung";
    if(!$("#modal").innerHTML) renderKiosk();
  }catch(e){
    $("#syncdot").className="dot off"; $("#synctxt").textContent="Gagal tersambung";
    if(!silent) $("#banner").innerHTML=`<div class="notice">${esc(errMsg(e))}</div>`;
  }
}

/* ---------- clock ---------- */
let lastMin=-1;
setInterval(()=>{
  const t=jk(nowMs()), c=$("#bigclock");
  if(c) c.innerHTML=`${pad2(t.h)}:${pad2(t.mi)}<span>:${pad2(t.s)}</span>`;
  if(t.mi!==lastMin){ lastMin=t.mi; if(S.mode==="kiosk" && !$("#modal").innerHTML) renderKiosk(); }
},1000);
setInterval(()=>{ if(!$("#modal").innerHTML) refresh(true); }, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(true); });
try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}

/* ---------- kiosk ---------- */
function pillFor(id){
  const st=(S.data?.status||{})[id]||{action:"in"};
  if(st.action==="in") return st.leave?`<span class="pill blue">${esc(st.leave)}</span>`:`<span class="pill">Belum absen</span>`;
  if(st.action==="out") return `<span class="pill ${st.late>0?"warn":"ok"}">Masuk ${esc(st.inStr)}</span>`;
  return `<span class="pill blue">Pulang ${esc(st.outStr)}</span>`;
}
function renderKiosk(){
  const v=$("#kioskView"); if(S.mode!=="kiosk"){ v.hidden=true; return; } v.hidden=false;
  if(!S.data){ v.innerHTML=`<div class="empty"><b>Memuat data dari Google Sheet…</b>Tunggu sebentar.</div>`; return; }
  const t=jk(nowMs());
  const all=S.data.employees, q=S.search.trim().toLowerCase();
  const rank=e=>e.store===S.store?0:1;
  const list=(q ? all.filter(e=>e.name.toLowerCase().includes(q)) : all.slice()).sort((a,b)=>rank(a)-rank(b)||String(a.store).localeCompare(String(b.store))||String(a.name).localeCompare(String(b.name)));
  const here=all;
  const done=here.filter(e=>((S.data.status[e.id]||{}).action||"in")!=="in").length;
  const nm=t.h*60+t.mi;
  // cuma shift yang dipakai karyawan aktif (di unit terpilih) yang ditampilkan
  const used=new Set(all.filter(e=>!S.store||e.store===S.store).map(e=>shiftOf(e.shift).id));
  const curs=S.data.shifts.filter(s=>{if(!used.has(s.id))return false;const a=+s.start.slice(0,2)*60+ +s.start.slice(3), b=+s.end.slice(0,2)*60+ +s.end.slice(3); return a<b? nm>=a&&nm<b : nm>=a||nm<b;});
  const keep=document.activeElement && document.activeElement.id==="q";
  v.innerHTML=`<div class="kiosk">
    <aside class="clockcard">
      <div class="eyebrow">Jam server (WIB)</div>
      <div class="bigclock" id="bigclock">${pad2(t.h)}:${pad2(t.mi)}<span>:${pad2(t.s)}</span></div>
      <div class="today">${esc(longDate(t.key))}</div>
      <button class="storebtn" id="pickStore"><span><span class="eyebrow" style="color:inherit;opacity:.75">Unit</span><b>${esc(S.store?storeName(S.store):"Semua unit")}</b></span><span aria-hidden="true">Ganti ›</span></button>
      <div class="shiftnow">${curs.length?`Shift berjalan: ${curs.map(c=>`<b>${esc(c.name)}</b> ${c.start}–${c.end}`).join(", ")}`:"Di luar jam shift"}</div>
      <div class="counts"><div><b>${done}</b>sudah absen</div><div><b>${Math.max(0,here.length-done)}</b>belum</div></div>
    </aside>
    <section class="picker">
      <div class="pickhead">
        <div><div class="eyebrow">Langkah 1 dari 3</div><h2>Ketuk nama kamu</h2></div>
        <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari nama" value="${esc(S.search)}" aria-label="Cari nama karyawan"></label>
      </div>
      ${list.length?`<div class="grid">${list.map(e=>`<button class="emp" data-emp="${esc(e.id)}">
        <div class="who"><div class="av">${esc(initials(e.name))}</div><div><div class="nm">${esc(e.name)}</div><div class="rl">${esc(e.role||"Karyawan")} · ${esc(storeName(e.store))}</div></div></div>
        <div class="foot">${pillFor(e.id)}<span class="sub">${esc(shiftOf(e.shift).name)}</span></div></button>`).join("")}</div>`
      :`<div class="empty"><b>${q?"Nama tidak ditemukan":"Belum ada karyawan"}</b>${q?"Coba ejaan lain.":"Tambahkan di Google Sheet, tab Karyawan."}</div>`}
    </section></div>`;
  $("#pickStore").onclick=chooseStore;
  const qi=$("#q"); qi.oninput=()=>{S.search=qi.value; renderKiosk();};
  if(keep){ qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length); }
  v.querySelectorAll("[data-emp]").forEach(b=>b.onclick=()=>openFlow(b.dataset.emp));
}
function chooseStore(){
  if(!S.data) return;
  $("#modal").innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <h2 style="font-size:24px">Tampilkan unit mana di atas?</h2>
    <p class="sub" style="margin:6px 0 16px">Cuma mengatur urutan nama di HP ini. Absen tetap tercatat di unit masing-masing karyawan.</p>
    <div style="display:grid;gap:10px"><button class="btn" style="justify-content:space-between;padding:14px 16px" data-st=""><b>Semua unit</b><span class="sub">${S.data.employees.length} karyawan</span></button>${S.data.stores.map(s=>`<button class="btn" style="justify-content:space-between;padding:14px 16px" data-st="${esc(s.id)}"><b>${esc(s.name)}</b><span class="sub">${S.data.employees.filter(e=>e.store===s.id).length} karyawan</span></button>`).join("")}</div>
    <button class="btn ghost" style="margin-top:12px;width:100%" id="stCancel">Batal</button></div></div>`;
  $("#modal").querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ S.store=b.dataset.st; ls.set("konstra_unit",S.store); $("#modal").innerHTML=""; renderKiosk(); });
  const c=$("#stCancel"); if(c) c.onclick=()=>{$("#modal").innerHTML="";};
}

const flow={emp:null,pin:"",action:null,photo:null,timer:null,mode:"enter",newPin:"",me:null,report:"",leaveType:"Izin",leaveKet:""};
function openFlow(id){
  const emp=S.data.employees.find(e=>e.id===id); if(!emp) return;
  Object.assign(flow,{emp,pin:"",photo:null,report:"",newPin:"",me:null,leaveType:"Izin",leaveKet:"",action:((S.data.status[id]||{}).action)||"in",mode:emp.hasPin?"enter":"new1"});
  pinBuf=""; renderPin();
}
function closeFlow(){ clearInterval(flow.timer); $("#modal").innerHTML=""; renderKiosk(); }
function sheet(html){
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").onclick=e=>{ if(e.target.id==="scrim") closeFlow(); };
  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeFlow);
}
const head=(e,sub)=>`<div class="sheethead"><div class="av">${esc(initials(e.name))}</div><div><b>${esc(e.name)}</b><div class="sub">${esc(sub)}</div></div><button class="btn ghost sm x" data-close aria-label="Tutup">✕</button></div>`;
const dots=(n,len=4)=>[...Array(len).keys()].map(i=>`<i class="${i<n?"f":""}"></i>`).join("");
const PIN_TXT={enter:["Masukkan PIN kamu","PIN 4 angka"],new1:["Buat PIN kamu","Pilih 4 angka yang gampang kamu ingat. Jangan kasih tahu orang lain."],new2:["Ulangi PIN","Ketik lagi 4 angka yang sama"],chg1:["PIN baru","Ketik 4 angka PIN baru"],chg2:["Ulangi PIN baru","Ketik lagi PIN baru yang sama"]};
let pinBuf="";
function renderPin(msg){
  const e=flow.emp, t=PIN_TXT[flow.mode], chg=flow.mode.indexOf("chg")===0;
  sheet(`${head(e,`${e.role||"Karyawan"} · ${storeName(e.store)}`)}
    ${flow.mode==="new1"?`<div class="notice info">Pertama kali pakai aplikasi ini? Buat PIN kamu sendiri dulu. PIN ini dipakai setiap absen.</div>`:""}
    <h3 style="text-align:center;font-size:23px;margin:2px 0 4px">${t[0]}</h3>
    <p class="sub" style="text-align:center;margin:0">${t[1]}</p>
    <div class="pinrow" id="pinrow">${dots(0)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="fn" data-k="c">Hapus</button><button data-k="0">0</button>${chg?`<button class="fn" id="pinBack">Kembali</button>`:`<button class="fn" data-close>Batal</button>`}</div>
    <div class="err" id="pinerr">${esc(msg||"")}</div>`);
  $("#modal").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
  const pb=$("#pinBack"); if(pb) pb.onclick=()=>{ flow.mode="enter"; renderMe(); };
}
async function pinKey(k){
  if(k==="c") pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf+=k;
  $("#pinrow").innerHTML=dots(pinBuf.length);
  if(pinBuf.length<4) return;
  const p=pinBuf; pinBuf="";
  const fail=msg=>{ const row=$("#pinrow"); row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake"); setTimeout(()=>row.innerHTML=dots(0),350); $("#pinerr").textContent=msg; };
  if(flow.mode==="new1"||flow.mode==="chg1"){ flow.newPin=p; flow.mode=flow.mode==="new1"?"new2":"chg2"; return renderPin(); }
  if(flow.mode==="new2"||flow.mode==="chg2"){
    const isNew=flow.mode==="new2";
    if(p!==flow.newPin){ flow.mode=isNew?"new1":"chg1"; flow.newPin=""; return renderPin("PIN tidak sama. Ulangi dari awal."); }
    busy(true,"Menyimpan PIN…");
    try{
      if(isNew){ const r=await call("setPin",flow.emp.id,p); flow.emp.hasPin=true; flow.me=r; flow.action=r.action; }
      else { await call("changePin",flow.emp.id,flow.pin,p); }
      flow.pin=p; busy(false); toast(isNew?"PIN tersimpan. Ingat baik-baik ya.":"PIN berhasil diganti.");
      flow.mode="enter"; renderMe();
    }catch(e){ busy(false); flow.mode=isNew?"new1":"chg1"; flow.newPin=""; renderPin(errMsg(e)); }
    return;
  }
  busy(true,"Cek PIN…");
  try{
    const r=await call("checkPin",flow.emp.id,p); busy(false);
    if(r.needSetup){ flow.mode="new1"; return renderPin(); }
    if(!r.ok) return fail(r.msg);
    flow.pin=p; flow.me=r; flow.action=r.action; renderMe();
  }catch(e){ busy(false); fail(errMsg(e)); }
}
function renderMe(){
  const e=flow.emp, m=flow.me||{action:flow.action}, sh=shiftOf(e.shift);
  const status = m.action==="in" ? (m.leave?`<span class="pill blue">${esc(m.leave)} hari ini</span>`:`<span class="pill">Belum absen hari ini</span>`)
    : m.action==="out" ? `<span class="pill ${m.late>0?"warn":"ok"}">Masuk ${esc(m.inStr)}${m.late>0?` · telat ${mnt(m.late)}`:""}</span>`
    : `<span class="pill blue">Masuk ${esc(m.inStr)} · Pulang ${esc(m.outStr||"–")}</span>`;
  const main = m.action==="in"&&m.leave ? `<button class="btn bigact" disabled>Hari ini kamu ${esc(m.leave.toLowerCase())}</button>`
    : m.action==="done" ? (m.outStr ? `<button class="btn bigact" disabled>Sudah absen pulang hari ini</button>`
      : `<button class="btn bigact" disabled>Absen hari ini sudah ditutup</button><p class="sub" style="margin:8px 0 0">Lupa absen pulang? Lapor lewat menu <b>Izin / Sakit / Lupa absen</b>.</p>`)
    : `<button class="btn ${m.action==="in"?"primary":"sun"} bigact" id="goClock">${m.action==="in"?"Absen masuk":"Absen pulang"}</button>`;
  const al=m.alerts||[], alOpen=al.filter(a=>!a.reported).length;
  const alBox = al.length ? `<div class="alertbox" role="status"><b>${alOpen?`Ada ${alOpen} absen yang belum beres`:"Laporan lupa absen kamu sedang dicek admin"}</b>
      ${alOpen?`<p>Lapor sekarang supaya jam kerja kamu benar dan tidak dihitung alpa.</p>`:""}
      ${al.slice(0,5).map((a,i)=>`<div class="alrow"><div><b>${esc(a.dateLong)}</b><span>${a.type==="pulang"?`Lupa absen pulang. Tercatat pulang ${esc(a.outStr)} (otomatis)`:"Tidak ada absen masuk dan pulang"}</span></div>
        ${a.reported?`<span class="pill">Sudah dilapor</span>`:`<button class="btn sm primary" data-al="${i}">Lapor</button>`}</div>`).join("")}</div>` : "";
  sheet(`${head(e,`${e.role||"Karyawan"} · ${storeName(e.store)}`)}
    ${alBox}
    <div class="eyebrow">Absen saya</div>
    <div class="mestat"><span class="sub">Jadwal ${esc(sh.name)} ${sh.start}–${sh.end}</span>${status}</div>
    ${main}
    <div class="megrid">
      <button class="btn" id="goLeave">Izin / Sakit / Lupa absen</button>
      ${LEMBUR_ON?`<button class="btn" id="goLem">Ajukan lembur</button>`:""}
      <button class="btn" id="goHist">Riwayat saya</button>
      <button class="btn" id="goPin">Ganti PIN</button>
      <button class="btn ghost" ${LEMBUR_ON?`style="grid-column:1/-1"`:""} data-close>Keluar</button>
    </div>`);
  const gc=$("#goClock"); if(gc) gc.onclick=()=>{ flow.photo=null; flow.report=""; flow.tugas=""; renderPhoto(); };
  const gt=$("#goTugas"); if(gt) gt.onclick=()=>{ flow.photo=null; flow.report=""; flow.tugas=""; renderTugas("",true); };
  $("#goLeave").onclick=()=>{ flow.leaveFor=null; renderLeave(); };
  $("#modal").querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{ flow.leaveFor=al[+b.dataset.al]; flow.leaveType="Lupa absen (lapor)"; flow.leaveKet=""; renderLeave(); });
  const gl=$("#goLem"); if(gl) gl.onclick=()=>renderLembur();
  $("#goHist").onclick=()=>renderHistory();
  $("#goPin").onclick=()=>{ flow.mode="chg1"; flow.newPin=""; pinBuf=""; renderPin(); };
}
function renderPhoto(){
  const e=flow.emp, isIn=flow.action==="in", sh=shiftOf(e.shift);
  sheet(`${head(e,`${isIn?"Absen masuk":"Absen pulang"}${flow.tugas?" · Tugas luar":` · ${sh.name} ${sh.start}–${sh.end}`}`)}
    <p class="eyebrow" style="text-align:center;margin:0 0 10px">Selfie dulu</p>
    <div class="cam">${flow.photo?`<img src="${flow.photo}" alt="Foto absen">`:`<div style="text-align:center;color:var(--muted);padding:16px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg><div style="font-size:13px;margin-top:6px">Ambil selfie dulu.<br>Wajah harus jelas.</div></div>`}</div>
    <div style="display:flex;margin-bottom:12px"><button class="btn" style="flex:1" id="takePhoto">${flow.photo?"Foto ulang":"Ambil foto"}</button></div>
    ${isIn?"":`<div class="field" style="margin-bottom:12px"><label for="rep">Laporan kerja hari ini</label><textarea id="rep" rows="4" placeholder="Contoh: input data penjualan, cek stok gudang, rapat dengan supplier">${esc(flow.report)}</textarea><span class="sub">Tulis singkat apa saja yang dikerjakan hari ini.</span></div>`}
    <p class="sub" style="text-align:center;margin:0 0 10px">Aplikasi akan cek lokasi kamu. Kalau HP minta izin lokasi, tekan <b>Izinkan</b>.</p>
    <button class="btn ${isIn?"primary":"sun"} bigact" id="doClock" ${flow.photo?"":"disabled"}>${isIn?"Absen masuk sekarang":"Absen pulang sekarang"}</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" id="backMe">Kembali</button>
    <div class="err" id="clkerr"></div>`);
  const rp=$("#rep"); if(rp) rp.oninput=()=>{ flow.report=rp.value; };
  $("#takePhoto").onclick=()=>{ const i=$("#camInput"); i.value=""; i.click(); };
  $("#doClock").onclick=submit;
  $("#backMe").onclick=renderMe;
}
function renderTugas(dist,pre){
  const e=flow.emp;
  sheet(`${head(e,`${e.role||"Karyawan"} · ${storeName(e.store)}`)}
    <div class="eyebrow">${pre?"Absen tugas luar":"Kamu di luar kantor"}</div>
    <h3 style="font-size:22px;margin:6px 0 4px">${pre?"Mau tugas ke mana?":"Lagi tugas di luar?"}</h3>

    <div class="field" style="margin-bottom:14px"><label for="tg">Keperluan tugas luar</label><textarea id="tg" rows="3" placeholder="Contoh: ketemu supplier di Tangerang, kembali ke kantor jam 14.00">${esc(flow.tugas||"")}</textarea></div>

const LEAVE=[["Izin","Ada keperluan, tidak masuk","Contoh: mengurus surat di kelurahan"],["Sakit","Tidak masuk karena sakit","Contoh: demam, sudah ke dokter"],["Lupa absen (lapor)","Sudah masuk / pulang tapi lupa absen","Contoh: masuk jam 09.05, lupa absen masuk"]];
function renderLeave(){
  const e=flow.emp, cur=LEAVE.find(x=>x[0]===flow.leaveType)||LEAVE[0], lf=flow.leaveFor;
  const ph = lf ? (lf.type==="pulang"?"Contoh: pulang jam 18.30, lupa absen pulang":"Contoh: masuk 08.55, pulang 18.30, lupa absen") : cur[2];
  sheet(`${head(e,`${e.role||"Karyawan"} · ${storeName(e.store)}`)}
    <div class="eyebrow">${lf?"Lapor lupa absen":"Lapor izin, sakit, atau lupa absen"}</div>
    ${lf?`<div class="notice info">Untuk <b>${esc(lf.dateLong)}</b>. ${lf.type==="pulang"?`Kamu absen masuk ${esc(lf.inStr)} tapi tidak absen pulang. Tulis jam kamu pulang.`:"Tulis jam masuk dan jam pulang kamu. Kalau hari itu kamu izin atau sakit, tulis juga di sini."}</div>`
      :`<div class="choice">${LEAVE.map(([v,d])=>`<button class="btn ${flow.leaveType===v?"primary":""}" data-lt="${esc(v)}"><b>${esc(v.replace(" (lapor)",""))}</b><span>${esc(d)}</span></button>`).join("")}</div>`}
    <div class="field" style="margin-bottom:14px"><label for="lk">${lf?"Jam dan keterangan":"Alasan / keterangan"}</label><textarea id="lk" rows="3" placeholder="${esc(ph)}">${esc(flow.leaveKet)}</textarea></div>
    <button class="btn primary bigact" id="lSend">Kirim laporan</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" id="backMe">Kembali</button>
    <div class="err" id="lerr"></div>`);
  $("#modal").querySelectorAll("[data-lt]").forEach(b=>b.onclick=()=>{ flow.leaveKet=$("#lk").value; flow.leaveType=b.dataset.lt; renderLeave(); });
  $("#lk").oninput=()=>{ flow.leaveKet=$("#lk").value; };
  $("#backMe").onclick=()=>{ flow.leaveFor=null; renderMe(); };
  $("#lSend").onclick=async()=>{
    const ket=$("#lk").value.trim(); if(!ket){ $("#lerr").textContent="Tulis alasannya dulu."; return; }
    busy(true,"Mengirim…");
    try{
      const r=await call("leave",flow.emp.id,flow.pin,flow.leaveType,ket,lf?lf.date:""); busy(false); refresh(true); flow.leaveKet=""; if(/^(Izin|Sakit)$/.test(r.jenis)&&flow.me&&flow.me.action==="in") flow.me.leave=r.jenis;

function shrink(file){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const s=Math.min(img.width,img.height), N=360, cv=document.createElement("canvas"); cv.width=cv.height=N;
      cv.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,N,N); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",0.7)); };
    img.onerror=()=>{URL.revokeObjectURL(url); rej();}; img.src=url; });
}
function getLoc(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    setTimeout(()=>fin(null),12000);
    try{ navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}),()=>fin(null),{enableHighAccuracy:true,timeout:11000,maximumAge:30000}); }catch(e){ fin(null); }
  });
}

function recPreset(k){
  const t=jk(nowMs()).key, [y,m,d]=t.split("-").map(Number);
  const D=(Y,M,Dd)=>new Date(Date.UTC(Y,M-1,Dd)), iso=x=>x.toISOString().slice(0,10);
  let f, to=t;
  if(k==="minggu"){ const x=D(y,m,d); f=iso(new Date(x-((x.getUTCDay()+6)%7)*864e5)); }
  else if(k==="bulan") f=iso(D(y,m,1));
  else if(k==="lalu"){ f=iso(D(y,m-1,1)); to=iso(D(y,m,0)); }
  else if(k==="gaji"){ const st=d>=28?D(y,m,28):D(y,m-1,28); f=iso(st); const e=iso(D(st.getUTCFullYear(),st.getUTCMonth()+2,27)); to=e<t?e:t; }
  else f=`${y}-01-01`;
  S.recFrom=f; S.recTo=to; loadRekap();
}

  if(S.recFrom>S.recTo) return toast("Tanggal awal harus sebelum tanggal akhir");
  S.recData="loading"; renderAdmin();
  try{ S.recData=await call("adminRekap",S.adminPin,S.recFrom,S.recTo,S.recStore); }catch(e){ S.recData=null; toast(errMsg(e)); }
  renderAdmin();
}

  };

  const wn=$("#wNow"); if(wn) wn.onclick=()=>go(thisMon);
  $("#wUnit").onchange=e=>{ S.wkUnit=e.target.value; S.wkData=null; renderAdmin(); };
  $("#wRef").onclick=()=>{ S.wkData=null; renderAdmin(); };
  const wc=$("#wCopy"); if(wc&&R) wc.onclick=()=>copyText(weekText(R),"Laporan mingguan disalin. Tinggal tempel di WhatsApp.");
}

/* ---------- shell ---------- */
function setMode(m){
  S.mode=m; $("#m-kiosk").setAttribute("aria-pressed",m==="kiosk"); $("#m-admin").setAttribute("aria-pressed",m==="admin");
  if(m==="kiosk") S.adminPin=null;
  $("#modal").innerHTML=""; renderKiosk(); renderAdmin();
}
$("#m-kiosk").onclick=()=>setMode("kiosk");
$("#m-admin").onclick=()=>setMode("admin");
if(URL_TOKO) ls.set("konstra_unit",URL_TOKO);
setMode("kiosk");
refresh();
})();
</script>
</body>
</html>

<style>
/* Layout: corporate stationery. Porcelain page, evergreen clock panel with a fine diamond lattice (from the logo), maroon only as a signature rule/indicator. Kiosk = panel + name grid; admin = tabs + ledger tables. */
:root{
  --bg:#E6EEE8; --surface:#FFFFFF; --sunk:#E9EFEA; --line:#D6E0D8; --line-strong:#C2CEC5; --lattice:rgba(15,58,41,.05);
  --fg:#16211B; --muted:#5E6C63;

  --panel:#0F3A29; --panel-fg:#F3F6F1;
  --maroon:#7C1E35; --maroon-soft:#F6E7EB;
  --sun:#7C1E35; --sun-fg:#FFFFFF;
  --ok:#17784A; --ok-soft:#E1F2E8; --warn:#B4560B; --warn-soft:#FBEBDB; --bad:#B42335; --bad-soft:#FAE3E6;
  --paper:#FFFFFF; --shadow:0 1px 2px rgba(15,34,25,.05),0 12px 32px rgba(15,34,25,.07);
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09100C; --surface:#111B15; --sunk:#17241D; --line:#24352B; --line-strong:#33483B; --lattice:rgba(255,255,255,.03);
  --fg:#E9F0EA; --muted:#97A99D; --accent:#6CC79A; --accent-fg:#06200F; --accent-soft:#13301F;
  --panel:#0E2A1F; --panel-fg:#EEF4EF; --maroon:#E07A93; --maroon-soft:#35161F; --sun:#E07A93; --sun-fg:#2A0610;
  --ok:#5BD49A; --ok-soft:#123327; --warn:#F0A659; --warn-soft:#3A2810; --bad:#FF7C8C; --bad-soft:#3D1820;
  --paper:#16231B; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B120E; --surface:#111B15; --sunk:#17241D; --line:#24352B; --line-strong:#33483B;
  --fg:#E9F0EA; --muted:#97A99D; --accent:#6CC79A; --accent-fg:#06200F; --accent-soft:#13301F;
  --panel:#0E2A1F; --panel-fg:#EEF4EF; --maroon:#E07A93; --maroon-soft:#35161F; --sun:#E07A93; --sun-fg:#2A0610;
  --ok:#5BD49A; --ok-soft:#123327; --warn:#F0A659; --warn-soft:#3A2810; --bad:#FF7C8C; --bad-soft:#3D1820;
  --paper:#16231B; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:repeating-linear-gradient(45deg,var(--lattice) 0 1px,transparent 1px 28px),repeating-linear-gradient(-45deg,var(--lattice) 0 1px,transparent 1px 28px);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.005em}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;margin-top:10px;background:var(--panel);color:var(--panel-fg);border-radius:14px;display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(9,30,20,.18)}
.top::after{content:"";position:absolute;left:16px;bottom:0;width:64px;height:3px;background:var(--maroon);border-radius:2px 2px 0 0}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.logo{height:50px;width:auto;border-radius:9px;background:#FFFFFF;padding:4px 8px;display:block}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block;line-height:1.15;color:var(--panel-fg)}
.brand small{display:block;color:var(--panel-fg);opacity:.68;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.brandbar{height:22px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:8px;padding:3px}

.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0F3A29;opacity:1}
.sync{font-size:12px;color:var(--panel-fg);opacity:.8;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}

/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#FFFFFF;border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* notice */
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:16px}
.notice.info{background:var(--accent-soft);color:var(--accent)}

/* ===== KIOSK ===== */
.kiosk{display:grid;grid-template-columns:350px 1fr;gap:28px;align-items:start}
.clockcard{background-color:var(--panel);color:var(--panel-fg);border-radius:14px;padding:28px 26px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);overflow:hidden;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px)}
.clockcard::before{content:"";position:absolute;right:-46px;top:-46px;width:132px;height:132px;transform:rotate(45deg);border:1px solid rgba(255,255,255,.18);border-radius:6px}
.clockcard::after{content:"";position:absolute;left:26px;right:26px;bottom:0;height:3px;background:var(--maroon)}
.clockcard>*{position:relative}
.clockcard .eyebrow{color:inherit;opacity:.7}
.bigclock{font-family:var(--f-body);font-weight:200;font-size:76px;line-height:1;letter-spacing:-.02em;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.bigclock span{font-size:30px;opacity:.55;font-weight:300}
.today{font-family:var(--f-display);font-size:19px;opacity:.95}
.storebtn{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:transparent;border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:10px;padding:12px 14px;text-align:left;transition:background .15s}
.storebtn:hover{background:rgba(255,255,255,.07)}
.storebtn b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block}
.shiftnow{margin-top:16px;font-size:13px;opacity:.85}
.counts{display:flex;gap:28px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16)}
.counts div{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.counts b{display:block;font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:0;text-transform:none;opacity:1;line-height:1.1}

.picker h2{font-size:32px}
.pickhead{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:200px;max-width:340px;position:relative}
.search input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:11px 14px 11px 40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.emp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;display:flex;flex-direction:column;gap:16px;min-height:140px;transition:border-color .15s,box-shadow .15s,transform .15s}
.emp:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.emp .who{display:flex;gap:14px;align-items:center}
.av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:17px;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.emp .nm{font-weight:700;line-height:1.3}
.emp .rl{font-size:12px;color:var(--muted);margin-top:2px}
.emp .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.sample{background:var(--maroon-soft);color:var(--maroon)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg);display:block;font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:4px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,14,.55);z-index:20;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:440px;max-height:calc(100% - 16px);overflow:auto;padding:26px;box-shadow:var(--shadow);border-top:3px solid var(--maroon)}
.sheet.wide{max-width:640px}
.sheethead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sheethead .x{margin-left:auto}
.pinrow{display:flex;justify-content:center;gap:16px;margin:8px 0 22px}
.pinrow i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
.pinrow i.f{background:var(--accent);border-color:var(--accent)}
.pinrow.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:60px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-body);font-size:24px;font-weight:300;font-variant-numeric:tabular-nums}
.pad button:hover{border-color:var(--accent)}
.pad button:active{background:var(--accent-soft)}
.pad .fn{font-size:13px;font-weight:600;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600;text-align:center;min-height:20px;margin-top:10px}
.cam{aspect-ratio:1;max-width:100%;width:240px;margin:0 auto 18px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border:1px dashed var(--line-strong)}
.cam img{width:100%;height:100%;object-fit:cover}
.actrow{display:flex;gap:10px;flex-wrap:wrap}
.actrow .btn{flex:1}
.bigact{width:100%;padding:17px;font-size:17px;border-radius:10px}

/* receipt */
.receipt{background:var(--paper);color:var(--fg);font-family:var(--f-body);font-size:13px;padding:24px 22px;position:relative;margin:0 auto 8px;max-width:330px;border:1px solid var(--line);border-top:3px solid var(--maroon);border-radius:4px}
.receipt .c{text-align:center}
.receipt h3{font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.06em}
.receipt hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .r span:first-child{color:var(--muted)}
.receipt .t{font-family:var(--f-body);font-size:48px;font-weight:200;text-align:center;letter-spacing:-.02em;margin:6px 0;font-variant-numeric:tabular-nums}
.receipt .st{text-align:center;margin-top:8px}
.countdown{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}

/* ===== ADMIN ===== */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--maroon)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{padding:18px 20px;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line)}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:38px;display:block;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{display:block;margin-top:2px}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:18px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardhead h3{font-size:21px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:12px 20px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:12px 20px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px}
.thumbs button{width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;overflow:hidden;background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .none{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:11px}
.namecell{display:flex;align-items:center;gap:12px}
.namecell .av{width:34px;height:34px;font-size:13px}
.sub{font-size:12px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.formgrid .full{grid-column:1/-1}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.listrow{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.listrow input{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0}
.pad16{padding:18px 20px}
.gate{max-width:380px;margin:48px auto;text-align:center}
.gate h2{font-size:30px;margin-bottom:6px}
.gate p{color:var(--muted);margin:0 0 20px}
.pinlist{display:flex;flex-direction:column}.pinrow2{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line)}.pinact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-left:auto}
.confirmbar{display:flex;gap:8px;align-items:center;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--panel-fg);padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow)}
.bigphoto{width:100%;border-radius:12px}

/* weekly report */
.wknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wknav select{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wknav .range{font-family:var(--f-display);font-weight:400;font-size:24px;padding:0 8px}
.kpis.five{grid-template-columns:repeat(5,1fr)}
.kpi .meter{height:4px;border-radius:99px;background:var(--sunk);margin-top:12px;overflow:hidden}
.kpi .meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;padding:22px 20px 12px;align-items:end}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.chart .track{width:100%;max-width:44px;height:150px;background:var(--sunk);border-radius:6px;display:flex;flex-direction:column-reverse;overflow:hidden}
.chart .s-ok{background:var(--accent)} .chart .s-late{background:var(--warn)}
.chart .val{font-family:var(--f-display);font-size:17px}
.chart .lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.35}
.chart .col.off .track{opacity:.45} .chart .col.today .lbl{color:var(--maroon)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 20px 16px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i,.dots i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--sunk)}
.legend i.ok{background:var(--accent)}
.dots{display:flex;gap:4px}
.dots i.ok{background:var(--accent)} .dots i.late,.legend i.late{background:var(--warn)} .dots i.absent,.legend i.absent{background:var(--bad)}
.dots i.pending,.legend i.pending{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)} .dots i.off,.legend i.off{opacity:.5}
.attn{display:grid;gap:0}
.attn .row{display:flex;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.attn .row:first-child{border-top:0}
.daycheck{display:flex;gap:6px;flex-wrap:wrap}
.daycheck label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:7px;padding:6px 10px;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--fg)}

@media (max-width:860px){
  .kiosk{grid-template-columns:1fr;gap:22px}
  .clockcard{position:relative;top:auto}
  .bigclock{font-size:60px}
  .kpis,.kpis.five{grid-template-columns:repeat(2,1fr)}
  .kpis.five .kpi:last-child{grid-column:1/-1}
  .chart{gap:6px;padding-inline:12px} .chart .track{height:110px}
  .setgrid,.formgrid{grid-template-columns:1fr}
  .brand b{font-size:18px}
  .logo{height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.busy{position:fixed;inset:0;background:rgba(8,20,14,.35);z-index:30;display:grid;place-items:center}
.busy div{background:var(--surface);padding:14px 20px;border-radius:10px;font-weight:600;box-shadow:var(--shadow)}
a.btn{text-decoration:none;color:inherit}
html,body{margin:0}
[hidden]{display:none!important}
.megrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.megrid .btn{padding:12px 10px;font-size:14px}
.mestat{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.field textarea{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;resize:vertical;min-height:84px}
.choice{display:grid;gap:8px;margin:10px 0 14px}
.choice .btn{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px}
.choice .btn span{font-size:12px;font-weight:500;opacity:.8}
.minikpi{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.minikpi div{padding:10px 8px;text-align:center;box-shadow:-1px 0 0 var(--line)}
.minikpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.minikpi span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.histlist{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:46vh;overflow-y:auto}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .sub{white-space:normal}
.notice.info{margin-bottom:12px}
</style>

<script>
const URL_TOKO = (new URLSearchParams(location.search).get("unit") || new URLSearchParams(location.search).get("toko") || "").replace(/[^a-zA-Z0-9_-]/g, "");
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = n => String(n).padStart(2,"0");
// Di halaman pembungkus (di luar script.google.com) data diambil lewat fetch tanpa akun Google.
const API_URL = window.KONSTRA_API || "";
const call = (fn, ...a) => API_URL
  ? fetch(API_URL, { method: "POST", body: JSON.stringify({ fn, args: a }), credentials: "omit", redirect: "follow" })
      .then(r => { if (!r.ok) throw new Error("Gagal tersambung ke server (" + r.status + ")"); return r.json(); })
      .then(j => { if (!j.ok) throw new Error(j.error); return j.result; })
  : new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
const errMsg = e => String((e && e.message) || e || "Terjadi kesalahan").replace(/^(Exception|Error):\s*/,"");
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); };
const busy = (on, txt="Menyimpan…") => { $("#busy").hidden=!on; $("#busytxt").textContent=txt; };
const initials = n => String(n||"?").replace(/^contoh\s*[-–]\s*/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"], BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const jkFmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function jk(ms){ const p={}; jkFmt.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value); return {y:+p.year,mo:+p.month,d:+p.day,h:+p.hour,mi:+p.minute,s:+p.second,key:`${p.year}-${p.month}-${p.day}`}; }
const longDate = key => { const [y,m,d]=key.split("-").map(Number); return `${HARI[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}, ${d} ${BULAN[m-1]} ${y}`; };
const dur = min => `${Math.floor((min||0)/60)}j ${Math.round((min||0)%60)}m`;
const mnt = v => { const t=Math.round(Number(v)||0), h=Math.floor(t/60), m=t%60; return h ? h+" jam"+(m?" "+m+" mnt":"") : m+" mnt"; };

const S = { data:null, offset:0, mode:"kiosk", store: URL_TOKO || ls.get("konstra_unit") || "", search:"",
  adminPin:null, sheetUrl:"", tab:"hari", day:null, dayStore:"all", dayData:null, recFrom:null, recTo:null, recStore:"all", recData:null,
  wkStart:null, wkUnit:"all", wkData:null };
const nowMs = () => Date.now() + S.offset;
const storeName = id => ((S.data?.stores||[]).find(s=>s.id===id)||{}).name || id || "–";
const shiftOf = id => (S.data?.shifts||[]).find(s=>s.id===id) || (S.data?.shifts||[])[0] || {name:"-",start:"",end:""};

/* ---------- data ---------- */
async function refresh(silent){
  try{
    const d = await call("getKioskData");
    S.data=d; S.offset=d.now-Date.now();
    $("#syncdot").className="dot on"; $("#synctxt").textContent="Tersambung";
    if(!$("#modal").innerHTML) renderKiosk();
  }catch(e){
    $("#syncdot").className="dot off"; $("#synctxt").textContent="Gagal tersambung";
    if(!silent) $("#banner").innerHTML=`<div class="notice">${esc(errMsg(e))}</div>`;
  }
}

/* ---------- clock ---------- */
let lastMin=-1;
setInterval(()=>{
  const t=jk(nowMs()), c=$("#bigclock");
  if(c) c.innerHTML=`${pad2(t.h)}:${pad2(t.mi)}<span>:${pad2(t.s)}</span>`;
  if(t.mi!==lastMin){ lastMin=t.mi; if(S.mode==="kiosk" && !$("#modal").innerHTML) renderKiosk(); }
},1000);
setInterval(()=>{ if(!$("#modal").innerHTML) refresh(true); }, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(true); });
try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}

/* ---------- kiosk ---------- */
function pillFor(id){
  const st=(S.data?.status||{})[id]||{action:"in"};
  if(st.action==="in") return st.leave?`<span class="pill blue">${esc(st.leave)}</span>`:`<span class="pill">Belum absen</span>`;
  if(st.action==="out") return `<span class="pill ${st.late>0?"warn":"ok"}">Masuk ${esc(st.inStr)}</span>`;
  return `<span class="pill blue">Pulang ${esc(st.outStr)}</span>`;
}
function renderKiosk(){
  const v=$("#kioskView"); if(S.mode!=="kiosk"){ v.hidden=true; return; } v.hidden=false;
  if(!S.data){ v.innerHTML=`<div class="empty"><b>Memuat data dari Google Sheet…</b>Tunggu sebentar.</div>`; return; }
  const t=jk(nowMs());
  const all=S.data.employees, q=S.search.trim().toLowerCase();
  const rank=e=>e.store===S.store?0:1;
  const list=(q ? all.filter(e=>e.name.toLowerCase().includes(q)) : all.slice()).sort((a,b)=>rank(a)-rank(b)||String(a.store).localeCompare(String(b.store))||String(a.name).localeCompare(String(b.name)));
  const here=all;
  const done=here.filter(e=>((S.data.status[e.id]||{}).action||"in")!=="in").length;
  const nm=t.h*60+t.mi;
  // cuma shift yang dipakai karyawan aktif (di unit terpilih) yang ditampilkan
  const used=new Set(all.filter(e=>!S.store||e.store===S.store).map(e=>shiftOf(e.shift).id));
  const curs=S.data.shifts.filter(s=>{if(!used.has(s.id))return false;const a=+s.start.slice(0,2)*60+ +s.start.slice(3), b=+s.end.slice(0,2)*60+ +s.end.slice(3); return a<b? nm>=a&&nm<b : nm>=a||nm<b;});
  const keep=document.activeElement && document.activeElement.id==="q";
  v.innerHTML=`<div class="kiosk">
    <aside class="clockcard">
      <div class="eyebrow">Jam server (WIB)</div>
      <div class="bigclock" id="bigclock">${pad2(t.h)}:${pad2(t.mi)}<span>:${pad2(t.s)}</span></div>
      <div class="today">${esc(longDate(t.key))}</div>
      <button class="storebtn" id="pickStore"><span><span class="eyebrow" style="color:inherit;opacity:.75">Unit</span><b>${esc(S.store?storeName(S.store):"Semua unit")}</b></span><span aria-hidden="true">Ganti ›</span></button>
      <div class="shiftnow">${curs.length?`Shift berjalan: ${curs.map(c=>`<b>${esc(c.name)}</b> ${c.start}–${c.end}`).join(", ")}`:"Di luar jam shift"}</div>
      <div class="counts"><div><b>${done}</b>sudah absen</div><div><b>${Math.max(0,here.length-done)}</b>belum</div></div>
    </aside>
    <section class="picker">
      <div class="pickhead">
        <div><div class="eyebrow">Langkah 1 dari 3</div><h2>Ketuk nama kamu</h2></div>
        <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari nama" value="${esc(S.search)}" aria-label="Cari nama karyawan"></label>
      </div>
      ${list.length?`<div class="grid">${list.map(e=>`<button class="emp" data-emp="${esc(e.id)}">
        <div class="who"><div class="av">${esc(initials(e.name))}</div><div><div class="nm">${esc(e.name)}</div><div class="rl">${esc(e.role||"Karyawan")} · ${esc(storeName(e.store))}</div></div></div>
        <div class="foot">${pillFor(e.id)}<span class="sub">${esc(shiftOf(e.shift).name)}</span></div></button>`).join("")}</div>`
      :`<div class="empty"><b>${q?"Nama tidak ditemukan":"Belum ada karyawan"}</b>${q?"Coba ejaan lain.":"Tambahkan di Google Sheet, tab Karyawan."}</div>`}
    </section></div>`;
  $("#pickStore").onclick=chooseStore;
  const qi=$("#q"); qi.oninput=()=>{S.search=qi.value; renderKiosk();};
  if(keep){ qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length); }
  v.querySelectorAll("[data-emp]").forEach(b=>b.onclick=()=>openFlow(b.dataset.emp));
}
function chooseStore(){
  if(!S.data) return;
  $("#modal").innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <h2 style="font-size:24px">Tampilkan unit mana di atas?</h2>
    <p class="sub" style="margin:6px 0 16px">Cuma mengatur urutan nama di HP ini. Absen tetap tercatat di unit masing-masing karyawan.</p>
    <div style="display:grid;gap:10px"><button class="btn" style="justify-content:space-between;padding:14px 16px" data-st=""><b>Semua unit</b><span class="sub">${S.data.employees.length} karyawan</span></button>${S.data.stores.map(s=>`<button class="btn" style="justify-content:space-between;padding:14px 16px" data-st="${esc(s.id)}"><b>${esc(s.name)}</b><span class="sub">${S.data.employees.filter(e=>e.store===s.id).length} karyawan</span></button>`).join("")}</div>

  const c=$("#stCancel"); if(c) c.onclick=()=>{$("#modal").innerHTML="";};
}

const flow={emp:null,pin:"",action:null,photo:null,timer:null,mode:"enter",newPin:"",me:null,report:"",leaveType:"Izin",leaveKet:""};
function openFlow(id){
  const emp=S.data.employees.find(e=>e.id===id); if(!emp) return;
  Object.assign(flow,{emp,pin:"",photo:null,report:"",newPin:"",me:null,leaveType:"Izin",leaveKet:"",action:((S.data.status[id]||{}).action)||"in",mode:emp.hasPin?"enter":"new1"});
  pinBuf=""; renderPin();
}
function closeFlow(){ clearInterval(flow.timer); $("#modal").innerHTML=""; renderKiosk(); }
function sheet(html){
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").onclick=e=>{ if(e.target.id==="scrim") closeFlow(); };

const head=(e,sub)=>`<div class="sheethead"><div class="av">${esc(initials(e.name))}</div><div><b>${esc(e.name)}</b><div class="sub">${esc(sub)}</div></div><button class="btn ghost sm x" data-close aria-label="Tutup">✕</button></div>`;
const dots=(n,len=4)=>[...Array(len).keys()].map(i=>`<i class="${i<n?"f":""}"></i>`).join("");
const PIN_TXT={enter:["Masukkan PIN kamu","PIN 4 angka"],new1:["Buat PIN kamu","Pilih 4 angka yang gampang kamu ingat. Jangan kasih tahu orang lain."],new2:["Ulangi PIN","Ketik lagi 4 angka yang sama"],chg1:["PIN baru","Ketik 4 angka PIN baru"],chg2:["Ulangi PIN baru","Ketik lagi PIN baru yang sama"]};
let pinBuf="";
function renderPin(msg){
  const e=flow.emp, t=PIN_TXT[flow.mode], chg=flow.mode.indexOf("chg")===0;
  sheet(`${head(e,`${e.role||"Karyawan"} · ${storeName(e.store)}`)}
    ${flow.mode==="new1"?`<div class="notice info">Pertama kali pakai aplikasi ini? Buat PIN kamu sendiri dulu. PIN ini dipakai setiap absen.</div>`:""}
    <h3 style="text-align:center;font-size:23px;margin:2px 0 4px">${t[0]}</h3>
    <p class="sub" style="text-align:center;margin:0">${t[1]}</p>
    <div class="pinrow" id="pinrow">${dots(0)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="fn" data-k="c">Hapus</button><button data-k="0">0</button>${chg?`<button class="fn" id="pinBack">Kembali</button>`:`<button class="fn" data-close>Batal</button>`}</div>
    <div class="err" id="pinerr">${esc(msg||"")}</div>`);
  $("#modal").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
  const pb=$("#pinBack"); if(pb) pb.onclick=()=>{ flow.mode="enter"; renderMe(); };
}
async function pinKey(k){
  if(k==="c") pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf+=k;
  $("#pinrow").innerHTML=dots(pinBuf.length);
  if(pinBuf.length<4) return;
  const p=pinBuf; pinBuf="";
  const fail=msg=>{ const row=$("#pinrow"); row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake"); setTimeout(()=>row.innerHTML=dots(0),350); $("#pinerr").textContent=msg; };
  if(flow.mode==="new1"||flow.mode==="chg1"){ flow.newPin=p; flow.mode=flow.mode==="new1"?"new2":"chg2"; return renderPin(); }
  if(flow.mode==="new2"||flow.mode==="chg2"){
    const isNew=flow.mode==="new2";
    if(p!==flow.newPin){ flow.mode=isNew?"new1":"chg1"; flow.newPin=""; return renderPin("PIN tidak sama. Ulangi dari awal."); }
    busy(true,"Menyimpan PIN…");
    try{
      if(isNew){ const r=await call("setPin",flow.emp.id,p); flow.emp.hasPin=true; flow.me=r; flow.action=r.action; }
      else { await call("changePin",flow.emp.id,flow.pin,p); }
      flow.pin=p; busy(false); toast(isNew?"PIN tersimpan. Ingat baik-baik ya.":"PIN berhasil diganti.");
      flow.mode="enter"; renderMe();
    }catch(e){ busy(false); flow.mode=isNew?"new1":"chg1"; flow.newPin=""; renderPin(errMsg(e)); }
    return;
  }
  busy(true,"Cek PIN…");
  try{
    const r=await call("checkPin",flow.emp.id,p); busy(false);
    if(r.needSetup){ flow.mode="new1"; return renderPin(); }
    if(!r.ok) return fail(r.msg);
    flow.pin=p; flow.me=r; flow.action=r.action; renderMe();
  }catch(e){ busy(false); fail(errMsg(e)); }
}
function renderMe(){
  const e=flow.emp, m=flow.me||{action:flow.action}, sh=shiftOf(e.shift);
  const status = m.action==="in" ? (m.leave?`<span class="pill blue">${esc(m.leave)} hari ini</span>`:`<span class="pill">Belum absen hari ini</span>`)
    : m.action==="out" ? `<span class="pill ${m.late>0?"warn":"ok"}">Masuk ${esc(m.inStr)}${m.late>0?` · telat ${mnt(m.late)}`:""}</span>`
    : `<span class="pill blue">Masuk ${esc(m.inStr)} · Pulang ${esc(m.outStr||"–")}</span>`;
  const main = m.action==="in"&&m.leave ? `<button class="btn bigact" disabled>Hari ini kamu ${esc(m.leave.toLowerCase())}</button>`
    : m.action==="done" ? (m.outStr ? `<button class="btn bigact" disabled>Sudah absen pulang hari ini</button>`
      : `<button class="btn bigact" disabled>Absen hari ini sudah ditutup</button><p class="sub" style="margin:8px 0 0">Lupa absen pulang? Lapor lewat menu <b>Izin / Sakit / Lupa absen</b>.</p>`)
    : `<button class="btn ${m.action==="in"?"primary":"sun"} bigact" id="goClock">${m.action==="in"?"Absen masuk":"Absen pulang"}</button>`;
  sheet(`${head(e,`${e.role||"Karyawan"} · ${storeName(e.store)}`)}
    <div class="eyebrow">Absen saya</div>
    <div class="mestat"><span class="sub">Jadwal ${esc(sh.name)} ${sh.start}–${sh.end}</span>${status}</div>
    ${main}
    <div class="megrid">
      <button class="btn" id="goLeave">Izin / Sakit / Lupa absen</button>
      ${LEMBUR_ON?`<button class="btn" id="goLem">Ajukan lembur</button>`:""}
      <button class="btn" id="goHist">Riwayat saya</button>
      <button class="btn" id="goPin">Ganti PIN</button>
      <button class="btn ghost" ${LEMBUR_ON?`style="grid-column:1/-1"`:""} data-close>Keluar</button>
    </div>`);
  const gc=$("#goClock"); if(gc) gc.onclick=()=>{ flow.photo=null; flow.report=""; flow.tugas=""; renderPhoto(); };
  const gt=$("#goTugas"); if(gt) gt.onclick=()=>{ flow.photo=null; flow.report=""; flow.tugas=""; renderTugas("",true); };
  $("#goLeave").onclick=()=>renderLeave();
  const gl=$("#goLem"); if(gl) gl.onclick=()=>renderLembur();
  $("#goHist").onclick=()=>renderHistory();
  $("#goPin").onclick=()=>{ flow.mode="chg1"; flow.newPin=""; pinBuf=""; renderPin(); };
}
function renderPhoto(){

    <p class="sub" style="text-align:center;margin:0 0 10px">Aplikasi akan cek lokasi kamu. Kalau HP minta izin lokasi, tekan <b>Izinkan</b>.</p>

  $("#doClock").onclick=submit;
  $("#backMe").onclick=renderMe;

const LEAVE=[["Izin","Ada keperluan, tidak masuk","Contoh: mengurus surat di kelurahan"],["Sakit","Tidak masuk karena sakit","Contoh: demam, sudah ke dokter"],["Lupa absen (lapor)","Sudah masuk / pulang tapi lupa absen","Contoh: masuk jam 09.05, lupa absen masuk"]];

const LEMPILL={Menunggu:"warn",Disetujui:"ok",Ditolak:"bad"};

async function renderLembur(){
  const e=flow.emp, sh=shiftOf(e.shift), today=jk(nowMs()).key, hd=head(e,`${e.role||"Karyawan"} · ${storeName(e.store)}`);
  const f=flow.lem||(flow.lem={date:today,start:sh.end||"17:00",end:"",ket:""});

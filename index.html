function shrink(file){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const s=Math.min(img.width,img.height), N=360, cv=document.createElement("canvas"); cv.width=cv.height=N;
      cv.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,N,N); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",0.7)); };
    img.onerror=()=>{URL.revokeObjectURL(url); rej();}; img.src=url; });
}
function getLoc(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    setTimeout(()=>fin(null),12000);
    try{ navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}),()=>fin(null),{enableHighAccuracy:true,timeout:11000,maximumAge:30000}); }catch(e){ fin(null); }
  });
}
async function submit(){
  busy(true,"Cek lokasi…");

  busy(true,"Menyimpan absen…");

    flow.loc=loc;

    busy(false); renderReceipt(r); refresh(true);
  }catch(e){

  }
}
function renderReceipt(r){
  const isOut=r.action==="out"||(r.already&&r.outStr!=="–");
  let st;
  if(isOut) st = r.ot? `<span class="pill blue">Lembur ${dur(r.ot)}</span>` : r.early>0? `<span class="pill bad">Pulang cepat ${mnt(r.early)}</span>` : `<span class="pill ok">Sesuai jadwal</span>`;
  else st = r.late>0? `<span class="pill warn">Telat ${mnt(r.late)}</span>` : `<span class="pill ok">Tepat waktu</span>`;
  sheet(`<div class="receipt" role="status">
      <div class="c"><h3>PT KONSTRA NIAGA PRATAMA</h3><div>${esc(r.store)}</div></div><hr>
      <div class="c eyebrow">${r.already?"Sudah absen hari ini":isOut?"Absen pulang":"Absen masuk"}</div>

      <div class="r"><span>Masuk</span><span>${esc(r.inStr)}</span></div>
      <div class="r"><span>Pulang</span><span>${esc(r.outStr)}</span></div>
      ${isOut?`<div class="r"><span>Jam kerja</span><span>${dur(r.work)}</span></div>`:""}
      ${r.geo?`<div class="r"><span>Lokasi</span><span>${esc(r.geo)}</span></div>`:""}

  if(!S.adminPin){

      <button class="btn ghost sm" id="lock">Kunci</button></div><div id="tabBody"></div>`;

      ${d.absent.map(a=>`<tr><td><div class="namecell"><div class="av">${esc(initials(a.name))}</div><b>${esc(a.name)}</b>${a.leave?` <span class="pill blue">${esc(a.leave)}</span>`:""}</div></td><td>${esc(a.store)}</td><td>${esc(a.shift)}</td>
        <td>${a.leave?"":`<button class="btn sm" data-fx="${esc(a.empId)}" data-nm="${esc(a.name)}" data-in="" data-out="">Isi absen</button>`}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    ${(d.reports||[]).length?`<div class="card"><div class="cardhead"><h3>Laporan izin, sakit, lupa absen</h3><span class="sub">${d.reports.length} laporan</span></div><div class="pinlist">
      ${d.reports.map(x=>`<div class="pinrow2"><div style="min-width:0;flex:1 1 240px"><div class="namecell"><div class="av">${esc(initials(x.name))}</div><div><b>${esc(x.name)}</b> <span class="pill ${x.jenis==="Lupa absen"?"warn":"blue"}">${esc(x.jenis)}</span><div class="sub" style="margin-top:4px">${esc(x.ket)}</div></div></div></div>
        ${x.jenis==="Lupa absen"?`<div class="pinact"><button class="btn sm primary" data-fx="${esc(x.empId)}" data-nm="${esc(x.name)}" data-in="${esc((d.rows.find(r=>r.empId===x.empId)||{}).inStr||"")}" data-out="" data-ket="${esc(x.ket)}">Isi jam</button></div>`:""}</div>`).join("")}</div></div>`:""}`}`;
  $("#dDay").onchange=e=>{S.day=e.target.value||jk(nowMs()).key; loadDay();};
  $("#dStore").onchange=e=>{S.dayStore=e.target.value; loadDay();};
  $("#dRef").onclick=loadDay;
  const cpd=$("#cpDay"); if(cpd&&d) cpd.onclick=()=>{
    const L=["*Laporan Absensi PT Konstra Niaga Pratama*",longDate(S.day)+(S.dayStore!=="all"?" · "+storeName(S.dayStore):""),"","Hadir: "+d.rows.length+" dari "+d.total+" karyawan","Telat: "+late+" orang","Sudah pulang: "+out];
    if(d.rows.length){ L.push("","*Masuk:*"); d.rows.forEach(r=>L.push("- "+r.name+" "+r.inStr+(r.auto?" (lupa absen pulang)":r.outStr?"–"+r.outStr:"")+(r.late>0?" (telat "+mnt(r.late)+")":""))); }
    if(d.absent.length){ L.push("","*Belum absen:*"); d.absent.forEach(a=>L.push("- "+a.name)); }
    copyText(L.join("\n"),"Laporan harian disalin. Tinggal tempel di WhatsApp.");
  };
  el.querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>openFix(b.dataset));
  el.querySelectorAll("[data-ph]").forEach(b=>b.onclick=async()=>{
    busy(true,"Memuat foto…");
    try{ const src=await call("adminPhoto",S.adminPin,b.dataset.ph); busy(false);
      $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet"><div class="sheethead"><b>${esc(b.dataset.lb)}</b><button class="btn ghost sm x" id="pc">✕</button></div><img class="bigphoto" src="${src}" alt="Foto absen"></div></div>`;
      const close=()=>$("#modal").innerHTML=""; $("#pc").onclick=close; $("#scrim").onclick=e=>{if(e.target.id==="scrim")close();};
    }catch(e){ busy(false); toast(errMsg(e)); }
  });
}
function openFix(ds){
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheethead"><div class="av">${esc(initials(ds.nm))}</div><div><b>${esc(ds.nm)}</b><div class="sub">${esc(longDate(S.day))}</div></div><button class="btn ghost sm x" id="fxX" aria-label="Tutup">✕</button></div>
    <div class="eyebrow">${ds.in?"Koreksi absen":"Isi absen"}</div>
    ${ds.ket?`<div class="notice info">Laporan karyawan: ${esc(ds.ket)}</div>`:""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0">
      <div class="field"><label for="fxIn">Jam masuk</label><input type="time" id="fxIn" value="${esc(ds.in||"")}"></div>
      <div class="field"><label for="fxOut">Jam pulang</label><input type="time" id="fxOut" value="${esc(ds.out||"")}"></div></div>
    <div class="field" style="margin-bottom:14px"><label for="fxNote">Catatan (opsional)</label><input type="text" id="fxNote" placeholder="Contoh: lupa absen, sudah konfirmasi" value="${esc(ds.ket?"Dari laporan lupa absen":"")}"></div>
    <button class="btn primary bigact" id="fxSave">Simpan</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" id="fxCancel">Batal</button>
    <div class="err" id="fxErr"></div></div></div>`;
  const close=()=>$("#modal").innerHTML="";
  $("#fxX").onclick=close; $("#fxCancel").onclick=close; $("#scrim").onclick=e=>{if(e.target.id==="scrim")close();};
  $("#fxSave").onclick=async()=>{
    const i=$("#fxIn").value, o=$("#fxOut").value, n=$("#fxNote").value;
    if(!i&&!o){ $("#fxErr").textContent="Isi jam masuk atau jam pulang."; return; }
    busy(true,"Menyimpan…");
    try{ const r=await call("adminFixAbsen",S.adminPin,S.day,ds.fx,i,o,n); busy(false); close(); toast(`Absen ${r.name} disimpan.`); loadDay(); }
    catch(e){ busy(false); $("#fxErr").textContent=errMsg(e); }
  };
}
/** Tombol cepat periode Rekap. Tanggal akhir tidak lewat hari ini. */
function recPreset(k){
  const t=jk(nowMs()).key, [y,m,d]=t.split("-").map(Number);
  const D=(Y,M,Dd)=>new Date(Date.UTC(Y,M-1,Dd)), iso=x=>x.toISOString().slice(0,10);
  let f, to=t;
  if(k==="minggu"){ const x=D(y,m,d); f=iso(new Date(x-((x.getUTCDay()+6)%7)*864e5)); }
  else if(k==="bulan") f=iso(D(y,m,1));
  else if(k==="lalu"){ f=iso(D(y,m-1,1)); to=iso(D(y,m,0)); }
  else if(k==="gaji"){ const st=d>=28?D(y,m,28):D(y,m-1,28); f=iso(st); const e=iso(D(st.getUTCFullYear(),st.getUTCMonth()+2,27)); to=e<t?e:t; }
  else f=`${y}-01-01`;
  S.recFrom=f; S.recTo=to; loadRekap();
}
async function loadRekap(){
  if(S.recFrom>S.recTo) return toast("Tanggal awal harus sebelum tanggal akhir");
  S.recData="loading"; renderAdmin();
  try{ S.recData=await call("adminRekap",S.adminPin,S.recFrom,S.recTo,S.recStore); }catch(e){ S.recData=null; toast(errMsg(e)); }
  renderAdmin();
}
function tabRekap(el){
  const d=S.recData && S.recData!=="loading" ? S.recData : null;
  el.innerHTML=`<div class="toolbar">
      <div class="field"><label for="rFrom">Dari</label><input type="date" id="rFrom" value="${S.recFrom}"></div>
      <div class="field"><label for="rTo">Sampai</label><input type="date" id="rTo" value="${S.recTo}"></div>
      <div class="field"><label for="rStore">Unit</label>${storeSel("rStore",S.recStore)}</div>
      <button class="btn primary" id="rGo">Tampilkan rekap</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px">${[["minggu","Minggu ini"],["bulan","Bulan ini"],["lalu","Bulan lalu"],["gaji","Periode gaji (28–27)"],["tahun","Tahun ini"]].map(([k,l])=>`<button class="btn sm" data-rp="${k}">${l}</button>`).join("")}</div>
    ${S.recData==="loading"?`<div class="empty">Menghitung rekap…</div>`:!d?`<div class="empty"><b>Pilih periode lalu tekan "Tampilkan rekap"</b>Biasanya per periode gaji, misalnya tanggal 1 sampai akhir bulan.</div>`:`
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Total hari hadir</span><b>${d.total.days}</b><span class="sub">semua karyawan</span></div>
      <div class="kpi warn"><span class="eyebrow">Kejadian telat</span><b>${d.total.late}</b><span class="sub">${d.total.lateMin} menit total</span></div>
      <div class="kpi"><span class="eyebrow">Jam kerja</span><b>${Math.round(d.total.work/60)}</b><span class="sub">jam tercatat</span></div>
      ${d.otOn?`<div class="kpi ok"><span class="eyebrow">Lembur</span><b>${(d.total.ot/60).toFixed(1)}</b><span class="sub">jam, yang disetujui</span></div>`:`<div class="kpi"><span class="eyebrow">Masuk hari libur</span><b>${d.total.hol||0}</b><span class="sub">hari, semua karyawan</span></div>`}</div>
    <div class="card"><div class="cardhead"><h3>Rekap per karyawan</h3><button class="btn sm" id="cp">Salin ke clipboard</button></div>
      <div class="tbl"><table><thead><tr><th>Karyawan</th><th>Unit</th><th class="num">Hadir</th><th class="num">Izin</th><th class="num">Sakit</th><th class="num">Alpa</th><th class="num">Telat</th><th class="num">Menit telat</th><th class="num">Pulang cepat</th><th class="num">Lupa pulang</th><th class="num">Masuk hari libur</th><th class="num">Jam kerja</th>${d.otOn?`<th class="num">Lembur</th>`:""}</tr></thead><tbody>
      ${d.rows.map(b=>`<tr><td><div class="namecell"><div class="av">${esc(initials(b.name))}</div><div><b>${esc(b.name)}</b><div class="sub">${esc(b.role)}</div></div></div></td><td>${esc(b.store)}</td>
        <td class="num">${b.days}</td><td class="num">${b.izin||0}</td><td class="num">${b.sakit||0}</td><td class="num">${b.alpa?`<span class="pill bad">${b.alpa}</span>`:"0"}</td><td class="num">${b.late?`<span class="pill warn">${b.late}x</span>`:"0"}</td><td class="num">${b.lateMin}</td><td class="num">${b.early}</td>
        <td class="num">${b.open?`<span class="pill bad">${b.open}</span>`:"0"}</td><td class="num">${b.hol?`<span class="pill blue">${b.hol} hari</span>`:"0"}</td><td class="num">${dur(b.work)}</td>${d.otOn?`<td class="num">${dur(b.ot)}</td>`:""}</tr>`).join("")}
      </tbody></table></div></div>
    <p class="sub" style="margin-top:12px">Rekap bulanan periode gaji juga otomatis ada di Google Sheet, tab Bulanan.</p>`}`;
  $("#rFrom").onchange=e=>S.recFrom=e.target.value;
  $("#rTo").onchange=e=>S.recTo=e.target.value;
  $("#rStore").onchange=e=>S.recStore=e.target.value;
  $("#rGo").onclick=loadRekap;
  el.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>recPreset(b.dataset.rp));
  const cp=$("#cp"); if(cp) cp.onclick=async()=>{
    const rows=[["Nama","Jabatan","Unit","Hari hadir","Izin","Sakit","Alpa","Kali telat","Menit telat","Pulang cepat","Lupa pulang","Masuk hari libur","Jam kerja"].concat(d.otOn?["Lembur (jam)"]:[]),...d.rows.map(b=>[b.name,b.role,b.store,b.days,b.izin||0,b.sakit||0,b.alpa||0,b.late,b.lateMin,b.early,b.open,b.hol||0,(b.work/60).toFixed(1)].concat(d.otOn?[(b.ot/60).toFixed(1)]:[]))];
    try{ await navigator.clipboard.writeText(rows.map(r=>r.join("\t")).join("\n")); toast("Disalin. Tempel ke Google Sheets."); }catch(e){ toast("Tidak bisa menyalin otomatis"); }
  };
}


/* ---------- laporan mingguan ---------- */
const HARI3=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const shortDate=k=>{const [y,m,d]=k.split("-").map(Number); return d+" "+BULAN[m-1].slice(0,3);};
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number); const t=new Date(Date.UTC(y,m-1,d+n)); return t.toISOString().slice(0,10);};
const mondayOf=k=>{const [y,m,d]=k.split("-").map(Number); const w=new Date(Date.UTC(y,m-1,d)).getUTCDay(); return addDays(k,-((w+6)%7));};
const weekLabel=s=>shortDate(s)+" – "+shortDate(addDays(s,6))+" "+addDays(s,6).slice(0,4);
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="sheet"><div class="sheethead"><b>Salin manual</b><button class="btn ghost sm x" id="pc">✕</button></div><p class="sub" style="margin:0 0 10px">Tekan lama teks di bawah, pilih Salin, lalu tempel di WhatsApp.</p><textarea id="cpbox" style="width:100%;min-height:240px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;font:inherit;font-size:13px;background:var(--bg);color:var(--fg)">${esc(t)}</textarea></div></div>`;
  const close=()=>$("#modal").innerHTML=""; $("#pc").onclick=close; $("#scrim").onclick=e=>{if(e.target.id==="scrim")close();}; const b=$("#cpbox"); b.focus(); b.select(); } }
async function loadWeek(){
  S.wkData="loading"; renderAdmin();
  try{ S.wkData=await call("adminWeek",S.adminPin,S.wkStart,S.wkUnit); }catch(e){ S.wkData=null; toast(errMsg(e)); }
  renderAdmin();
}
function weekText(R){
  const ic={ok:"🟢",warn:"🟠",bad:"🔴","":"⚪"};
  const L=["*Laporan Absensi Mingguan PT Konstra Niaga Pratama*","Minggu "+weekLabel(R.start)+(R.unitName?" · "+R.unitName:""),"","Kehadiran: "+(R.tot.pct===null?"–":R.tot.pct+"%"),"Hadir: "+R.tot.hadir+" hari kerja","Telat: "+R.tot.late+"x ("+mnt(R.tot.lateMin)+")","Lupa absen pulang: "+R.tot.open+"x","","*Per karyawan:*"];
  R.people.forEach(p=>L.push(ic[p.note.cls]+" "+p.name+" ("+(p.role||"-")+"): hadir "+p.hadir+"/"+p.expected+", telat "+p.late+"x"+(p.open?", lupa pulang "+p.open+"x":"")));
  const att=R.people.filter(p=>p.note.cls==="bad"||p.note.cls==="warn");
  if(att.length){ L.push("","*Perlu perhatian:*"); att.forEach(p=>L.push("- "+p.name+": "+p.why.join(", "))); }
  return L.join("\n");
}
function tabLaporan(el){
  const thisMon=mondayOf(jk(nowMs()).key);
  if(!S.wkStart) S.wkStart=thisMon;
  const R=S.wkData&&S.wkData!=="loading"&&S.wkData.start===S.wkStart?S.wkData:null;
  if(!R && S.wkData!=="loading"){ loadWeek(); return; }
  const thisWeek=S.wkStart===thisMon;
  el.innerHTML=`<div class="toolbar" style="justify-content:space-between">
      <div class="wknav"><button class="btn sm" id="wPrev" aria-label="Minggu sebelumnya">‹</button><span class="range">${esc(weekLabel(S.wkStart))}</span><button class="btn sm" id="wNext" aria-label="Minggu berikutnya" ${thisWeek?"disabled":""}>›</button>
        ${thisWeek?`<span class="pill blue">Minggu ini</span>`:`<button class="btn sm ghost" id="wNow">Ke minggu ini</button>`}
        <label class="sr-only" for="wUnit">Unit</label>${storeSel("wUnit",S.wkUnit)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" id="wCopy" ${R?"":"disabled"}>Salin laporan (WA)</button><button class="btn sm" id="wRef">Muat ulang</button></div></div>
    ${!R?`<div class="empty">Memuat laporan dari Google Sheet…</div>`:(()=>{ const max=Math.max(1,R.emps,...R.perDay.map(d=>d.total)); const att=R.people.filter(p=>p.note.cls==="bad"||p.note.cls==="warn"); return `
    <div class="kpis five">
      <div class="kpi ok"><span class="eyebrow">Kehadiran</span><b>${R.tot.pct===null?"–":R.tot.pct+"%"}</b><div class="meter"><i style="width:${R.tot.pct||0}%"></i></div></div>
      <div class="kpi"><span class="eyebrow">Hadir</span><b>${R.tot.hadir}</b><span class="sub">dari ${R.tot.exp} hari kerja</span></div>
      <div class="kpi warn"><span class="eyebrow">Telat</span><b>${R.tot.late}</b><span class="sub">total ${R.tot.lateMin} menit</span></div>
      <div class="kpi bad"><span class="eyebrow">Lupa absen pulang</span><b>${R.tot.open}</b><span class="sub">masuk tanpa pulang</span></div>
      <div class="kpi"><span class="eyebrow">Jam kerja</span><b>${Math.round(R.tot.work/60)}</b><span class="sub">jam tercatat</span></div></div>
    <div class="card"><div class="cardhead"><h3>Kehadiran per hari</h3><span class="sub">${R.emps} karyawan aktif</span></div>
      <div class="chart">${R.perDay.map(d=>`<div class="col ${d.off&&!d.total?"off":""} ${d.today?"today":""}"><span class="val">${d.future?"":d.total}</span>
        <div class="track" title="${esc(HARI[d.dow]+" "+shortDate(d.k)+(d.hol?" (libur: "+d.hol+")":"")+": "+d.ok+" tepat waktu, "+d.late+" telat")}"><div class="s-ok" style="height:${d.ok/max*100}%"></div><div class="s-late" style="height:${d.late/max*100}%"></div></div>
        <span class="lbl">${HARI3[d.dow]}<br>${shortDate(d.k)}</span></div>`).join("")}</div>
      <div class="legend"><span><i class="ok"></i>Tepat waktu</span><span><i class="late"></i>Telat</span><span>Hari kerja: ${R.workDays.map(n=>HARI3[n]).join(", ")}</span></div></div>
    <div class="card"><div class="cardhead"><h3>Per karyawan</h3><span class="sub">Kotak = Senin sampai Minggu</span></div>
      ${R.people.length?`<div class="tbl"><table><thead><tr><th>Karyawan</th><th>Minggu ini</th><th class="num">Hadir</th><th class="num">Telat</th><th class="num">Menit telat</th><th class="num">Lupa pulang</th><th class="num">Jam kerja</th><th class="num">Kehadiran</th><th>Catatan</th></tr></thead><tbody>
      ${R.people.map(p=>`<tr><td><div class="namecell"><div class="av">${esc(initials(p.name))}</div><div><b>${esc(p.name)}</b><div class="sub">${esc(p.role)} · ${esc(p.unit)}</div></div></div></td>
        <td><div class="dots">${p.marks.map(x=>`<i class="${x.st}" title="${esc(x.tip)}"></i>`).join("")}</div></td>
        <td class="num">${p.hadir}/${p.expected}</td><td class="num">${p.late?`<span class="pill warn">${p.late}x</span>`:"0"}</td><td class="num">${p.lateMin}</td>
        <td class="num">${p.open?`<span class="pill bad">${p.open}</span>`:"0"}</td><td class="num">${dur(p.work)}</td><td class="num">${p.pct===null?"–":p.pct+"%"}</td>
        <td><span class="pill ${p.note.cls}">${esc(p.note.txt)}</span></td></tr>`).join("")}</tbody></table></div>
      <div class="legend" style="padding-top:12px"><span><i class="ok"></i>Hadir tepat waktu</span><span><i class="late"></i>Telat</span><span><i class="absent"></i>Tidak absen</span><span><i class="pending"></i>Belum absen hari ini</span><span><i class="off"></i>Libur / belum lewat</span></div>`
      :`<div class="pad16"><div class="empty"><b>Belum ada karyawan aktif</b>Tambahkan di Google Sheet, tab Karyawan.</div></div>`}</div>
    <div class="card"><div class="cardhead"><h3>Perlu perhatian</h3><span class="sub">${att.length} orang</span></div>
      ${att.length?`<div class="attn">${att.map(p=>`<div class="row"><div class="av">${esc(initials(p.name))}</div><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="sub">${esc(p.why.join(" · "))}</div></div><span class="pill ${p.note.cls}">${esc(p.note.txt)}</span></div>`).join("")}</div>`:`<div class="pad16 sub">Aman, nggak ada yang perlu ditegur minggu ini.</div>`}</div>
    <p class="sub" style="margin-top:12px">Kehadiran = hari hadir dibagi hari kerja yang sudah lewat. Hari kerja diatur di Google Sheet, tab Pengaturan App (hari_kerja).</p>`; })()}`;
  const go=k=>{ S.wkStart=k; S.wkData=null; renderAdmin(); };
  $("#wPrev").onclick=()=>go(addDays(S.wkStart,-7));
  $("#wNext").onclick=()=>{ if(!thisWeek) go(addDays(S.wkStart,7)); };
  const wn=$("#wNow"); if(wn) wn.onclick=()=>go(thisMon);
  $("#wUnit").onchange=e=>{ S.wkUnit=e.target.value; S.wkData=null; renderAdmin(); };
  $("#wRef").onclick=()=>{ S.wkData=null; renderAdmin(); };
  const wc=$("#wCopy"); if(wc&&R) wc.onclick=()=>copyText(weekText(R),"Laporan mingguan disalin. Tinggal tempel di WhatsApp.");
}

/* ---------- shell ---------- */
function setMode(m){
  S.mode=m; $("#m-kiosk").setAttribute("aria-pressed",m==="kiosk"); $("#m-admin").setAttribute("aria-pressed",m==="admin");
  if(m==="kiosk") S.adminPin=null;
  $("#modal").innerHTML=""; renderKiosk(); renderAdmin();
}
$("#m-kiosk").onclick=()=>setMode("kiosk");
$("#m-admin").onclick=()=>setMode("admin");
if(URL_TOKO) ls.set("konstra_unit",URL_TOKO);
setMode("kiosk");
refresh();
})();
